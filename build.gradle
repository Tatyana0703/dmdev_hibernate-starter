plugins {
    id 'java'
    id "com.ewerk.gradle.plugins.querydsl" version "1.0.10"
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

//sourceSets {
//    main {
//        java {
//            srcDirs += "$buildDir/generated/sources/annotationProcessor/java/main"
//        }
//    }
//}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations {
    querydsl.extendsFrom implementation, runtimeOnly, compileOnly
}

dependencies {
    implementation 'org.hibernate:hibernate-core:6.5.3.Final'
    runtimeOnly 'org.postgresql:postgresql:42.7.4'
//    implementation 'com.vladmihalcea:hibernate-types-52:2.21.1'   //для JsonBinaryType (hibernate 5)
    implementation 'org.slf4j:slf4j-log4j12:2.0.15'

    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.8.3'    //для JsonBinaryType (hibernate 6)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'         //для JsonBinaryType (hibernate 6)

//    annotationProcessor 'org.hibernate:hibernate-jpamodelgen:5.5.7.Final'

//    implementation 'javax.annotation:javax.annotation-api:1.3.2'
//    implementation 'com.querydsl:querydsl-jpa:5.0.0'
//    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0'

//    implementation 'com.querydsl:querydsl-jpa:5.1.0'
//    implementation 'com.querydsl:querydsl-apt:5.1.0'

    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.2.0'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.1'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.1'
//    testImplementation 'com.h2database:h2:1.4.200'
    // https://mvnrepository.com/artifact/org.testcontainers/postgresql
    testImplementation 'org.testcontainers:postgresql:1.20.0'
}

querydsl {
    jpa = true
    querydslSourcesDir = "$buildDir/generated/sources/annotationProcessor/java/main"
}

compileQuerydsl {
//    enabled = false
    options.annotationProcessorPath = configurations.querydsl
}
////compileQuerydsl.dependsOn(clean)

test {
    useJUnitPlatform()
}